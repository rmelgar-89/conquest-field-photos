<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picture Renamer</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous"
  />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1 class="text-center my-4">Picture Renamer</h1>

    <!-- Photo Names Input Section -->
    <div id="photo-names-section">
      <h2>Enter Photo Names</h2>
      <form id="photo-names-form">
        <div class="mb-3">
          <textarea
            id="photo-names"
            class="form-control"
            placeholder="Enter photo names, one per line"
            rows="10"
            required
            aria-label="Photo names, one per line"
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Next</button>
      </form>
    </div>

    <!-- Photo Upload Section -->
    <div id="photo-upload-section" style="display: none;">
      <div class="upload-header">
        <button id="back-button" type="button" class="btn btn-outline-secondary" aria-label="Go back to edit photo names">
          Back
        </button>
        <h2>Upload Photos</h2>
      </div>
      <form id="photo-upload-form" class="mb-3"></form>

      <!-- Progress bar for ZIP generation -->
      <div id="progress-container" class="progress-container" style="display: none;" role="status" aria-live="polite">
        <p>Generating ZIP file...</p>
        <div class="progress-track">
          <div id="progress-bar" class="progress-fill" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>
      </div>

      <button id="process-button" class="btn btn-success w-100">
        Process
      </button>
    </div>
  </div>

  <!-- Include JSZip and FileSaver.js -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
    integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"
    integrity="sha384-PlRSzpewlarQuj5alIadXwjNUX+2eNMKwr0f07ShWYLy8B6TjEbm7ZlcN/ScSbwy"
    crossorigin="anonymous"
  ></script>
  <!-- Include Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"
  ></script>
  <!-- Include your JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
